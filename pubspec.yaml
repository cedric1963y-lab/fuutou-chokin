name: fuutou_chokin
description: "封筒貯金・袋分け貯金：給料日に袋分けして、残りは繰り越しか貯金へ。広告つき無料＋買い切りプレミアムのiPhoneアプリ。"
publish_to: 'none'

version: 1.1.6+11

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_tracking_transparency: ^2.0.7
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  in_app_purchase: ^3.3.1
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  in_app_review: ^2.0.11
  home_widget: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/licenses/

  fonts:
    - family: KiwiMaru
      fonts:
        - asset: assets/fonts/KiwiMaru-Medium.ttf
